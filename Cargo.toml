# Skidbladnir is a Rust + Tauri 2 app. It replaced an Electron app, retired in Phase 6
# of ROADMAP.md; that app's last source is at the `electron-final` tag.
#
# Layout (the Phase 1 decision, recorded in ROADMAP.md):
#   crates/*    pure-Rust logic with no Tauri dependency — testable offline
#   src-tauri/  the Tauri 2 application shell (added in Phase 1)
#   frontend/   the Nuxt + Tailwind frontend (added in Phase 1)
[workspace]
resolver = "2"
members = ["crates/skidbladnir-encode", "src-tauri"]

[workspace.package]
edition = "2024"
license = "ISC"
authors = ["Justin Icenhour"]
repository = "https://github.com/basic-automation/Skidbladnir"

[workspace.dependencies]
# Binds libwebp's WebPConfig, which carries a 1:1 field for every encoder control the
# Electron UI exposed — the reason this is the encode backend rather than a pure-Rust
# encoder (which reaches none of the advanced knobs) or a bundled cwebp sidecar.
# Vendored and statically linked by default, so there is no system libwebp to find on
# Windows or macOS.
# Decodes the user's input files only. It is NOT the encoder: its WebP encoder exposes
# none of the advanced controls, which is why libwebp-sys does the encoding. Default
# features are off so the binary carries the four formats the app accepts and no more.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
# Read directly (the same version `image` uses) for the PNG text chunks that carry EXIF
# and XMP, which `image` does not expose; see `src/metadata.rs`.
png = "0.18"
base64 = "0.23"
# The AVIF encoder (ROADMAP.md Phase 7). Rust over rav1e: no C library on any platform.
# Default features on: `asm` is rav1e's hand-written SIMD, assembled with `nasm`, which is
# therefore a build requirement (README "Build from source"; installed on every CI
# runner). `threading` is what lets the multi-threading control mean something.
ravif = "0.13"
# The AVIF decoder: the user's AVIF input, and our own AVIF output for the preview, so
# the comparison shows on every platform rather than only where the web engine happens
# to decode AVIF. Rust over rav1d, the Rust port of dav1d, whose SIMD also needs `nasm`.
# `binary` is off: it only adds a PNG writer for the crate's own command-line tool.
avif-decode = { version = "3", default-features = false }
libwebp-sys = "0.14"
# The JPEG XL encoder is libjxl itself (BSD-3), bound directly in `src/jxl.rs`. The
# existing Rust wrappers (`jpegxl-rs`, `jpegxl-sys`) are GPL-3.0, which an ISC app cannot
# link, so they are not used. `jpegxl-src` carries libjxl's source and its CMake build;
# it runs at build time only and nothing of it is linked. `pkg-config` is the fallback
# for a dev host without CMake, which links the system libjxl instead (see build.rs).
jpegxl-src = "0.12"
pkg-config = "0.3"
# The JPEG XL decoder: our own output for the preview and the reported dimensions, and
# JPEG XL input. Pure Rust, so no second copy of libjxl's decoder is needed.
jxl-oxide = { version = "0.12", default-features = false }
# GIF input (ROADMAP.md Phase 4), read as raw indexed frames so the compositing onto the
# canvas can follow libwebp's own gif2webp exactly rather than image-rs's rules.
gif = { version = "0.14", default-features = false, features = ["std"] }
# The version is not redundant with the path: a path dependency without one resolves as a
# wildcard `*`, which `cargo deny` rejects and which would publish as an unbounded range.
skidbladnir-encode = { path = "crates/skidbladnir-encode", version = "0.1" }
tauri = { version = "2", features = ["macos-private-api"] }
# The native file and directory pickers. The app never browses the filesystem itself —
# the user picks, and the app writes only where they pointed.
tauri-plugin-dialog = "2"
# In-app updates from the signed manifest `release.yml` publishes. Rust-side only: the
# window gets two commands, not the plugin's own IPC permissions.
tauri-plugin-updater = "2"
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Clippy runs with `-D warnings` in CI. `nursery` is deliberately absent: its lints
# are unstable across toolchains and the dev host (nightly) and CI (stable) would
# disagree. Never silence a lint with `#![allow(...)]` — fix the code.
[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
