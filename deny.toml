# Supply-chain gating for the Rust workspace: security advisories, licence policy and
# duplicate-dependency pressure. Run with `cargo deny check`.
#
# The allow-list below is not aspirational — it is the set of licences actually present in
# this tree, reviewed once. A new licence appearing is meant to fail the build and be a
# decision, not something that slides in with a dependency bump.

[graph]
# Skidbladnir ships on all three desktop platforms, so the Windows and macOS dependency
# trees must be checked from Linux too. Without this, a Windows-only crate's licence or
# advisory is invisible here and only surfaces in a release build.
targets = [
	{ triple = "x86_64-unknown-linux-gnu" },
	{ triple = "x86_64-pc-windows-msvc" },
	{ triple = "x86_64-apple-darwin" },
	{ triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
# Vulnerabilities and yanked crates always fail.
#
# `unmaintained` is scoped to WORKSPACE dependencies rather than the whole graph. Six
# unmaintained crates reach this tree transitively through Tauri — proc-macro-error
# (RUSTSEC-2024-0370) and five `unic-*` crates (RUSTSEC-2025-0075/0080/0081/0098/0100, all
# of open-i18n/rust-unic) — and every one of them reports "No safe upgrade is available".
# Failing the build on those would mean an ignore-list that never shrinks and stops being
# read. Scoped this way, an unmaintained advisory against a crate *we* chose still fails,
# which is the case worth acting on.
unmaintained = "workspace"
# No blanket ignores. An advisory that genuinely does not apply gets an entry here with a
# comment saying why, so the reasoning is reviewable rather than invisible.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
	"0BSD",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"CC0-1.0",
	"ISC",
	"MIT",
	"MIT-0",
	# Weak, file-level copyleft. Present via cssparser / selectors / option-ext, which are
	# used unmodified, so the obligation is satisfied by shipping their notices.
	"MPL-2.0",
	"Unicode-3.0",
	"Unlicense",
	"Zlib",
]

[bans]
# Duplicate versions are normal in a tree this size (Tauri pulls several windows-sys
# generations), so this warns rather than fails. It is here to keep the number visible.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
