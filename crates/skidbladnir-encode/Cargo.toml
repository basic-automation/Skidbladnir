[package]
name = "skidbladnir-encode"
version = "0.1.0"
description = "The encode core for Skidbladnir: the settings model and the WebP, AVIF, JPEG XL and HEIC encoders behind the GUI."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# HEIC through x265 instead of Kvazaar: lossless, 4:4:4 and 10-bit output, and x265's own
# tuning. It links the libheif `scripts/build-libheif.sh --edition gpl` builds, which has
# x265 (GPL-2.0-or-later) inside, so an app built with it is distributed under
# GPL-3.0-or-later as a whole. See README.md, "Editions".
x265 = []
# Every optional feature.
full = ["x265"]

[dependencies]
gif = { workspace = true }
image = { workspace = true }
libwebp-sys = { workspace = true }
avif-decode = { workspace = true }
jxl-oxide = { workspace = true }
png = { workspace = true }
resvg = { workspace = true }
tiff = { workspace = true }
flate2 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
jpegxl-src = { workspace = true }
cmake = { workspace = true }
cc = { workspace = true }
pkg-config = { workspace = true }

[dev-dependencies]
# The parity test writes PNG fixtures; integration tests do not inherit [dependencies].
image = { workspace = true }
png = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
