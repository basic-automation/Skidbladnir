# The window, drawn with gpui: the default UI since 1.3.0. The Tauri shell (src-tauri) opens
# it unless `SKIDBLADNIR_UI=webview` asks for the Nuxt window instead, or this one cannot
# start. It reads and writes the same preferences and presets as the webview window, by
# compiling the shell's own preferences.rs, presets.rs and preview.rs in (src/shell).
[package]
name = "skidbladnir-gpui"
version = "0.1.0"
description = "Skidbladnir's window, drawn with gpui."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "skidbladnir_gpui"

[features]
# The GPL edition: HEIC through x265, with x265's controls.
gpl = ["skidbladnir-encode/x265"]

[dependencies]
# gpuikit says to expect breaking changes in every pre-1.0 release, so both it and the
# gpui distribution it builds against are pinned exactly, to the pair gpuikit's own
# Cargo.lock resolves at v0.9.0. Two different gpui versions in one tree do not link.
gpuikit = "=0.9.0"
gpui = { package = "gpui-unofficial", version = "=1.17.2", default-features = false, features = ["font-kit", "wayland", "x11"] }
# `runtime_shaders`: the Metal shaders are compiled when the app starts rather than by
# `xcrun metal` at build time, which recent Xcodes no longer ship by default.
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.17.2", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
skidbladnir-encode = { workspace = true }
image = { workspace = true, features = ["webp"] }
smallvec = "1"
# For the shell's own preferences.rs, presets.rs and preview.rs, compiled in unchanged.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
libwebp-sys = { workspace = true }
futures = "0.3"
# Where Tauri keeps the app's config, so both windows share one.
dirs = "6"
# The updater: the manifest and the download, and the signature check, as
# tauri-plugin-updater makes it.
ureq = "3"
minisign-verify = "0.2"

# "Choose images…" with an Images filter, which gpui's own dialog cannot take: the desktop's
# file-chooser portal on Linux, asked directly through the same `ashpd` gpui uses.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "file_chooser"] }
url = "2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.15"

# Installing an update: the macOS .app.tar.gz, and the Windows installer through ShellExecuteW.
[target.'cfg(target_os = "macos")'.dependencies]
tar = "0.4"
flate2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
