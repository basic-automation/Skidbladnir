[package]
# The product identity decided in Phase 0: name, binary and appId are all Skidbladnir.
name = "skidbladnir"
# The product version — the only copy. tauri.conf.json deliberately omits `version` so it
# reads this one; the root package.json that used to be a second copy left with Electron.
version = "0.10.0"
description = "Convert images to next-generation formats, with the whole encoder exposed."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# The logic lives in a library, with the binary a thin wrapper, which is what makes it
# testable. Only `rlib`: Tauri's template also emits `staticlib` and `cdylib` so mobile
# targets can link the app, and this is a desktop-only product. Dropping them is not
# cosmetic — rav1d's x86 assembly (the AVIF decoder) takes non-PIC relocations against
# tables the Rust side exports, which cannot be linked into a `cdylib`
# ("relocation R_X86_64_PC32 cannot be used against symbol 'dav1d_dr_intra_derivative'").
name = "skidbladnir_lib"
crate-type = ["rlib"]

[features]
# How Tauri decides where the frontend comes from. WITHOUT this feature the binary loads
# `devUrl` (the Nuxt dev server); WITH it, the frontend is served from the assets embedded
# at compile time from `frontendDist`. `cargo tauri build` enables it; a bare
# `cargo build --release` does not, so such a binary starts up showing
# "Connection refused" rather than the app. Release builds must go through
# `cargo tauri build`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libwebp-sys = { workspace = true }
skidbladnir-encode = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-updater = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# Writing PNG fixtures for the preview tests.
image = { workspace = true }
