# Build (or restore) the libheif Skidbladnir ships — libheif with the edition's HEVC encoder
# (Kvazaar for the standard edition, x265 for the GPL one) and the libde265 decoder built
# in — and make it findable for the rest of the job.
#
# Needs the third_party/ submodules checked out. The result is cached on the pinned
# submodule commits, the edition, the build script and the runner image, so a routine run
# does not rebuild three C/C++ libraries. See scripts/build-libheif.sh for what is built
# and why. The image's name is an output too: release.yml keys its Rust cache on it, for
# the same reason.
name: libheif
description: Build or restore libheif with the edition's HEVC encoder and libde265, and put it on the library path.
inputs:
  edition:
    description: standard (Kvazaar, the ISC app) or gpl (x265, the GPL-3.0-or-later app built with the `gpl` feature).
    required: false
    default: standard
  target-arch:
    description: Set for a cross build (x86_64 on an Apple Silicon runner).
    required: false
    default: ""
outputs:
  image:
    description: The runner image (ImageOS, plus the glibc version on Linux), e.g. ubuntu22-glibc2.35.
    value: ${{ steps.key.outputs.image }}
runs:
  using: composite
  steps:
    - name: libheif cache key
      id: key
      shell: bash
      run: |
        case "${{ inputs.edition }}" in
          standard) dir=build/libheif ;;
          gpl) dir=build/libheif-gpl ;;
          *) echo "::error::unknown edition ${{ inputs.edition }}"; exit 1 ;;
        esac
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        # The runner image, not just the OS. A libheif built on ubuntu-24.04 needs that
        # image's glibc and libstdc++, so the release's ubuntu-22.04 job must never restore
        # it. ImageOS is the hosted runner's own variable (ubuntu22, ubuntu24, macos15,
        # win22, ...), read from the shell: the expression context `env.ImageOS` would be
        # empty, because the env context leaves out what the runner process inherits. On
        # Linux the glibc version goes in as well, which also covers a runner without
        # ImageOS.
        image="${ImageOS:-unknown}"
        if [ "$RUNNER_OS" = Linux ]; then
          image="$image-glibc$(getconf GNU_LIBC_VERSION | cut -d' ' -f2)"
        fi
        echo "image=$image" >> "$GITHUB_OUTPUT"
        echo "key=libheif-${{ inputs.edition }}-${{ runner.os }}-${{ runner.arch }}-$image-${{ inputs.target-arch }}-$(git submodule status third_party | awk '{print $1}' | tr -d '+-' | tr '\n' '-')${{ hashFiles('scripts/build-libheif.sh') }}" >> "$GITHUB_OUTPUT"

    - name: Restore libheif
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}

    - name: Build libheif
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SKIDBLADNIR_TARGET_ARCH: ${{ inputs.target-arch }}
      run: scripts/build-libheif.sh --edition "${{ inputs.edition }}"

    - name: Put libheif on the library path
      shell: bash
      run: |
        # The app is linked against this build and must never fall back to a system libheif.
        # Its build scripts find it by the edition's feature; the path is set here too so
        # nothing in the job can link the other edition's.
        echo "SKIDBLADNIR_LIBHEIF=vendored" >> "$GITHUB_ENV"
        echo "SKIDBLADNIR_LIBHEIF_DIR=$GITHUB_WORKSPACE/${{ steps.key.outputs.dir }}" >> "$GITHUB_ENV"
        case "$RUNNER_OS" in
          # For the release binary run from target/ and for AppImage bundling, which
          # resolves the app's libraries with ldd.
          Linux) echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/${{ steps.key.outputs.dir }}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV" ;;
          # Test binaries in target/*/deps load heif.dll from PATH.
          Windows) echo "$GITHUB_WORKSPACE/${{ steps.key.outputs.dir }}/bin" >> "$GITHUB_PATH" ;;
        esac
