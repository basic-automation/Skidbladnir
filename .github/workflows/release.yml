# Builds the Tauri app on all three platforms for a tagged release and attaches the
# installers to the GitHub release for that tag.
#
# Every platform is built twice, once per edition. The standard edition (Skidbladnir_*)
# encodes HEIC with Kvazaar and is ISC; the GPL edition (Skidbladnir-GPL_*, the `gpl`
# feature) encodes it with x265 and is distributed under GPL-3.0-or-later, so every release
# also carries its complete source (Skidbladnir-<version>-source.tar.gz, with the
# submodules) beside the GPL installers. Each edition updates from its own manifest.
#
# The dev host can only build Linux, so Windows and macOS artifacts exist *only* because
# this workflow produces them. A release cut without a successful run here has Linux
# artifacts and nothing else, and its notes must say so.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and attach artifacts to (e.g. v0.5.0). Ignored for a dry run.
        required: false
        type: string
      dry_run:
        description: Build the branch this was dispatched on and keep the installers as workflow artifacts, attaching nothing to any release. How a change to this workflow is tested before a tag exists.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Every installer carries its own static libjxl, libavif with libaom, and libjpeg-turbo,
  # built from source; never the runner's.
  SKIDBLADNIR_LIBJXL: vendored
  SKIDBLADNIR_LIBAVIF: vendored
  SKIDBLADNIR_LIBJPEG: vendored

jobs:
  bundle:
    name: bundle / ${{ matrix.platform }}${{ matrix.edition == 'gpl' && ' / gpl' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not deny the release the artifacts the others produced.
      fail-fast: false
      matrix:
        platform: [linux, linux-arm64, windows, macos-arm64, macos-x64]
        edition: [standard, gpl]
        include:
          # The oldest system the Linux installers support, because they need whatever
          # glibc and libstdc++ they were built against: Ubuntu 22.04 (glibc 2.35), which
          # makes Debian 12 (2.36) work too. Built on ubuntu-latest, 0.14.0 needed glibc
          # 2.39 and did not start on either. The floor is checked after bundling.
          - { platform: linux, os: ubuntu-22.04, target: "" }
          # 64-bit ARM Linux (aarch64): a native build on GitHub's ARM runner, on the same
          # Ubuntu release, so the same glibc floor holds.
          - { platform: linux-arm64, os: ubuntu-22.04-arm, target: "" }
          - { platform: windows, os: windows-latest, target: "" }
          # macos-latest is Apple Silicon, so its native build is aarch64 only. Intel Macs
          # get their own .dmg, cross-built on the same runner.
          - { platform: macos-arm64, os: macos-latest, target: "" }
          - { platform: macos-x64, os: macos-latest, target: x86_64-apple-darwin }

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ (inputs.dry_run && github.ref) || inputs.tag || github.ref }}
          # libheif, Kvazaar, x265 and libde265 are pinned submodules under third_party/.
          submodules: true

      - name: Install the Linux system dependencies Tauri needs
        # patchelf is what bundles the AppImage. It is unavailable on the dev host, which
        # is owner-gated there — but it is a plain apt package here, so the AppImage is
        # produced in CI even though it cannot be produced locally. Every package here
        # exists under the same name on Ubuntu 22.04 (jammy). The xkbcommon, xcb, Wayland,
        # fontconfig and FreeType headers are the gpui window's.
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libfontconfig-dev libfreetype-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install nasm
        # libaom, libjpeg-turbo and the AV1 decoder (rav1d) assemble their x86 SIMD with
        # nasm; rav1d's and libaom's builds fail outright without it. So does x265's, in the
        # GPL edition. Their ARM SIMD is written for the system assembler, so the ARM leg
        # needs none.
        if: matrix.platform != 'linux-arm64'
        uses: ilammy/setup-nasm@v1

      - name: Build libheif (${{ matrix.edition }} edition)
        # Every installer ships this libheif beside the app (tauri.<platform>.conf.json,
        # and tauri.gpl*.conf.json for the GPL edition's). The Intel Mac build is a cross
        # build on an Apple Silicon runner.
        id: libheif
        uses: ./.github/actions/libheif
        with:
          edition: ${{ matrix.edition }}
          target-arch: ${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || '' }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        # rust-cache keys on the OS name and the CPU only ("Linux-x64" on every Ubuntu
        # image). Its target/ keeps what crates.io dependencies' build scripts compiled,
        # such as libwebp-sys's libwebp, and Cargo reuses that C without looking at the
        # compiler or the glibc (only the workspace's own crates are cleaned and rebuilt).
        # A cache from an ubuntu-24.04 run would bring GLIBC_2.38 needs into the 22.04
        # build. So the key names the runner image, as the libheif cache does, and the
        # platform, which keeps the two macOS legs (one runner, two targets) apart.
        with:
          key: ${{ matrix.edition }}-${{ matrix.platform }}-${{ steps.libheif.outputs.image }}

      - name: Build the frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run generate

      - name: Bundle
        # `tauri build` enables the custom-protocol feature, which is what makes the binary
        # serve the embedded frontend rather than the dev server. The CLI is the prebuilt
        # `@tauri-apps/cli` from the frontend's lockfile, as in ci.yml, rather than
        # `cargo install tauri-cli`, which compiled it from source on every platform.
        #
        # Updater artifacts (a `.sig` beside each installer, and the macOS `.app.tar.gz`)
        # are switched on here rather than in tauri.conf.json, because producing them needs
        # the signing key: in the config, every local and CI build without the key would
        # fail. The key's public half is in tauri.conf.json; the private half exists only
        # as these two secrets and in the owner's ~/.tauri.
        #
        # Without the secret a real release still ships, unsigned for the updater, with a
        # warning — the installers work, the app just cannot offer them as an update. A dry
        # run signs with a throwaway key instead, so the whole updater path is exercised
        # before a tag exists; its signatures verify against nothing and are never published.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cli=frontend/node_modules/.bin/tauri
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry run without the signing secret: signing with a throwaway key"
            "$cli" signer generate --ci -w "$RUNNER_TEMP/throwaway.key" -p throwaway >/dev/null
            export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/throwaway.key")"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=throwaway
          fi
          args=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, so ${{ matrix.platform }} (${{ matrix.edition }}) is built without updater signatures and will not be offered as an update"
          fi
          if [ -n "${{ matrix.target }}" ]; then
            args+=(--target "${{ matrix.target }}")
          fi
          # The GPL edition: x265's libheif, its own notices and licence, and its own
          # updater manifest, so a GPL install only ever updates to a GPL build.
          if [ "${{ matrix.edition }}" = gpl ]; then
            args+=(--features gpl --config tauri.gpl.conf.json)
            if [ "$RUNNER_OS" = Windows ]; then args+=(--config tauri.gpl.windows.conf.json); fi
          fi
          cd src-tauri
          "../$cli" build "${args[@]}"
          # linuxdeploy leaves some bundled libraries' copyright files out of the AppImage
          # (those its GTK plugin adds, and a few of their dependencies). Find them, and
          # bundle the AppImage again with them added; the next step checks the result.
          if [[ "${{ matrix.platform }}" == linux* ]]; then
            python3 ../scripts/appimage-notices.py --missing-config "$RUNNER_TEMP/appimage-docs.json" ../target/release/bundle/appimage/*.AppImage
            if [ -s "$RUNNER_TEMP/appimage-docs.json" ]; then
              "../$cli" bundle --bundles appimage "${args[@]}" --config "$RUNNER_TEMP/appimage-docs.json"
            fi
          fi

      - name: The Linux installers need nothing newer than Ubuntu 22.04 has
        # Reads what the binary and every library in the .deb, the .rpm and the AppImage need from
        # glibc and libstdc++ (scripts/glibc-floor.py), prints the newest of each, and fails
        # above glibc 2.35, GLIBCXX_3.4.30 or CXXABI_1.3.13 (GCC 12's libstdc++, which
        # Ubuntu 22.04 and Debian 12 ship). A build over the floor installs and then does
        # not start, so it must not reach a release.
        if: startsWith(matrix.platform, 'linux')
        run: |
          bundle=target/release/bundle
          python3 scripts/glibc-floor.py --glibc 2.35 --glibcxx 3.4.30 --cxxabi 1.3.13 "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage

      - name: The AppImage carries the licence of every library it bundles
        # The AppImage bundles Ubuntu 22.04's GTK, WebKitGTK, GLib and the rest, mostly LGPL.
        # linuxdeploy copies most packages' Debian copyright files into it, and the Bundle
        # step adds the ones it leaves out; this checks that every bundled library's package
        # (`dpkg -S` on this runner) now has its file inside, so a library that arrives without
        # its licence fails the release instead of shipping.
        if: startsWith(matrix.platform, 'linux')
        run: python3 scripts/appimage-notices.py target/release/bundle/appimage/*.AppImage

      - name: The macOS app is signed, ad hoc
        # There is no Apple Developer ID yet, so tauri.macos.conf.json signs ad hoc
        # ("signingIdentity": "-"). Unsigned, the arm64 app carried only the linker's
        # signature, which does not seal the bundle, and Apple silicon Macs call such a
        # download "damaged" with no way past it. Ad hoc signed, macOS asks the user to
        # allow it once in System Settings > Privacy & Security instead.
        #
        # The hardened runtime is off ("hardenedRuntime": false). Its library validation
        # loads only code "signed by Apple or signed with the same Team ID as the main
        # executable" (Apple, com.apple.security.cs.disable-library-validation), and an
        # ad hoc signature has no Team ID, so it would refuse Frameworks/libheif.1.dylib.
        # With a Developer ID, remove both keys (APPLE_SIGNING_IDENTITY would override the
        # first, not the second): the bundle then signs with the team's identity, the
        # hardened runtime returns, and notarization becomes possible.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # target/<triple>/release/bundle for a cross build, target/release/bundle otherwise.
          bundle=target/release/bundle
          if [ -n "${{ matrix.target }}" ]; then bundle="target/${{ matrix.target }}/release/bundle"; fi
          app=$(find "$bundle/macos" -maxdepth 1 -type d -name '*.app' | head -1)
          if [ -z "$app" ]; then
            echo "::error::no .app in $bundle/macos"
            exit 1
          fi
          echo "APP=$app" >> "$GITHUB_ENV"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          for library in "$app"/Contents/Frameworks/*; do
            codesign --verify --strict --verbose=2 "$library"
            codesign -dv "$library" 2>&1 | grep -E '^(Executable|Identifier|Format|CodeDirectory|Signature|TeamIdentifier)'
          done
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          otool -L "$app/Contents/MacOS/$executable" | grep -i heif
          grep -q '^Signature=adhoc' "$RUNNER_TEMP/codesign.txt" || { echo "::error::$app is not signed ad hoc"; exit 1; }
          if grep -q '^CodeDirectory.*flags=.*runtime' "$RUNNER_TEMP/codesign.txt"; then
            echo "::warning::the hardened runtime is on, so library validation may refuse the ad hoc signed libheif"
          fi

      - name: The macOS app starts, and a screenshot shows its window
        # No person has opened a macOS build yet. This runs the bundled app's own
        # executable from inside the signed bundle, fails if it exits within 15 seconds
        # (a dyld or library-validation error ends it at once), and keeps a screenshot
        # and the app's output so a person can see what macOS drew. The Intel app runs
        # under Rosetta on this Apple silicon runner. The bundle is not quarantined here,
        # so Gatekeeper is not involved; the next step looks at that.
        #
        # It takes under a minute. If something hangs (an app that ignores the kill, say),
        # the timeout fails the leg within minutes, not at the job's six-hour limit while
        # the manifest job waits for it.
        if: runner.os == 'macOS'
        timeout-minutes: 3
        shell: bash
        run: |
          out="$RUNNER_TEMP/macos-launch"
          mkdir -p "$out"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          binary="$APP/Contents/MacOS/$executable"
          lipo -info "$binary"
          if [ "${{ matrix.target }}" = x86_64-apple-darwin ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::Rosetta is not installed on this runner, so the Intel app was not launched"
            exit 0
          fi
          "$binary" > "$out/app.log" 2>&1 &
          pid=$!
          for second in $(seq 1 15); do
            sleep 1
            # Gone, or exited and not yet reaped (a zombie still answers kill -0).
            if ! kill -0 "$pid" 2>/dev/null || [ "$(ps -o stat= -p "$pid" 2>/dev/null | cut -c1)" = Z ]; then
              status=0
              wait "$pid" || status=$?
              cat "$out/app.log"
              echo "::error::the app exited after ${second}s with status $status"
              exit 1
            fi
            if [ "$second" = 10 ]; then
              # perl's alarm bounds it, in case macOS stops to ask for screen-recording
              # permission. Without that permission the picture shows only the desktop.
              perl -e 'alarm 20; exec @ARGV' screencapture -x "$out/window.png" || echo "::warning::screencapture failed"
            fi
          done
          echo "still running after 15s"
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat "$out/app.log"

      - name: What Gatekeeper says about a downloaded copy (report only)
        # A browser marks a download with the com.apple.quarantine attribute, and Gatekeeper
        # judges only marked apps. This marks a copy the same way, prints Gatekeeper's
        # verdicts, then opens the copy as a double-click would and screenshots whatever
        # dialog appears, so the README's first-launch steps can be matched to what macOS
        # actually says. It never fails the job, and it runs before the installers are
        # attached, so it is bounded: syspolicy_check asks Apple's servers, and spctl,
        # open or log show could stall. A timeout counts as a failure, which
        # continue-on-error lets through.
        if: ${{ !cancelled() && runner.os == 'macOS' && env.APP != '' }}
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/macos-launch"
          mkdir -p "$out" "$RUNNER_TEMP/gatekeeper"
          copy="$RUNNER_TEMP/gatekeeper/$(basename "$APP")"
          ditto "$APP" "$copy"
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)" "$copy"
          echo "== com.apple.quarantine: $(xattr -p com.apple.quarantine "$copy")"
          echo "== spctl --status"
          spctl --status
          echo "== spctl --assess --type execute -vv, the quarantined copy"
          spctl --assess --type execute -vv "$copy"
          echo "== spctl --assess -vv, the bundle as built"
          spctl --assess -vv "$APP"
          if command -v syspolicy_check >/dev/null; then
            echo "== syspolicy_check distribution"
            syspolicy_check distribution "$copy"
          fi
          dmg=$(find "$(dirname "$(dirname "$APP")")/dmg" -name '*.dmg' 2>/dev/null | head -1)
          if [ -n "$dmg" ]; then
            echo "== spctl --assess --type open, $(basename "$dmg")"
            spctl --assess --type open --context context:primary-signature -vv "$dmg"
          fi
          echo "== open the quarantined copy"
          open "$copy"
          sleep 10
          perl -e 'alarm 20; exec @ARGV' screencapture -x "$out/gatekeeper.png"
          pkill -f "$(basename "$APP")/Contents/MacOS/"
          echo "== syspolicyd's log"
          log show --last 2m --style compact --predicate 'process == "syspolicyd"' 2>/dev/null | tail -40
          exit 0

      - uses: actions/upload-artifact@v7
        # Not named skidbladnir-*: the manifest job merges every artifact of that name.
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        with:
          name: macos-launch-${{ matrix.platform }}-${{ matrix.edition }}
          path: ${{ runner.temp }}/macos-launch/
          if-no-files-found: warn

      - name: Collect the artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # `find` rather than a fixed list: the bundle layout differs per platform and a
          # missing glob must not silently produce an empty upload.
          # target/<triple>/release/bundle for a cross build, target/release/bundle otherwise.
          find target -path '*/release/bundle/*' -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.sig' \) -exec cp {} dist-artifacts/ \;
          # The macOS updater archive is `Skidbladnir.app.tar.gz` on both architectures,
          # and one release cannot hold two assets with the same name. Name it like the
          # .dmg beside it: Skidbladnir_<version>_<aarch64|x64>.app.tar.gz.
          archive=$(find target -path '*/release/bundle/macos/*' -type f -name '*.app.tar.gz' | head -1)
          if [ -n "$archive" ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
            case "${{ matrix.platform }}" in macos-x64) arch=x64 ;; *) arch=aarch64 ;; esac
            cp "$archive" "dist-artifacts/Skidbladnir_${version}_${arch}.app.tar.gz"
            rm -f dist-artifacts/*.app.tar.gz.sig
            cp "$archive.sig" "dist-artifacts/Skidbladnir_${version}_${arch}.app.tar.gz.sig"
          fi
          # tauri names the .rpm the RPM way, Skidbladnir-<version>-1.<arch>.rpm. Give it the
          # other installers' form, Skidbladnir_<version>_<arch>.rpm, so the GPL renaming below
          # and the updater manifest (scripts/updater-manifest.py) find it like the rest.
          for file in dist-artifacts/*.rpm dist-artifacts/*.rpm.sig; do
            [ -e "$file" ] || continue
            renamed=$(printf '%s' "$file" | sed -E 's#/Skidbladnir-([0-9][^-]*)-[^.]+\.(x86_64|aarch64)\.rpm#/Skidbladnir_\1_\2.rpm#')
            [ "$renamed" = "$file" ] || mv "$file" "$renamed"
          done
          # Both editions' installers land on one release, so the GPL edition's say so in
          # their names: Skidbladnir-GPL_<version>_... A signature does not cover the name.
          if [ "${{ matrix.edition }}" = gpl ]; then
            for file in dist-artifacts/Skidbladnir_*; do
              mv "$file" "dist-artifacts/Skidbladnir-GPL_${file#dist-artifacts/Skidbladnir_}"
            done
          fi
          ls -la dist-artifacts
          if [ -z "$(ls -A dist-artifacts)" ]; then
            echo "::error::No installers were produced for ${{ matrix.platform }} (${{ matrix.edition }})"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: skidbladnir-${{ matrix.platform }}-${{ matrix.edition }}
          path: dist-artifacts/*
          if-no-files-found: error

      - name: Attach to the release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # A manual run that is not a dry run must name its tag; otherwise TAG would fall
          # back to the branch name and create a stray draft release named after it.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ inputs.tag }}" ]; then
            echo "::error::a manual run needs a tag, or dry_run"
            exit 1
          fi
          # The workflow can be reached two ways: a tag pushed on its own, or a tag created
          # alongside a release. In the first case there is no release to upload to yet, and
          # `gh release upload` would simply fail — so create a draft release to hold the
          # artifacts rather than losing a green build to an ordering accident. From 1.0.0 a
          # release is a full release, not a prerelease, so that /releases/latest and the
          # repository's "Latest" badge find it; a beta is marked prerelease when published.
          # Installed copies are not offered a draft: the manifest job waits for it to be
          # published and re-run.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no release for $TAG yet; creating a draft release to hold the artifacts"
            gh release create "$TAG" --draft --title "$TAG" --notes "Artifacts attached by CI. Notes pending."
          fi
          # Everything but the .sig files. The manifest job copies each signature into
          # latest.json from this job's workflow artifact, and the app reads the signature
          # from there, so on the release page a .sig is one more file to puzzle over.
          files=()
          for file in dist-artifacts/*; do
            case "$file" in *.sig) ;; *) files+=("$file") ;; esac
          done
          gh release upload "$TAG" "${files[@]}" --clobber

  # The .deb on the oldest systems it is said to support, beyond the bundle job's version
  # check: apt installs it, resolving its dependencies from that system's own archive, and
  # the loader then finds every library the app needs at a version that system has. The
  # result does not hold back the release; read it in the run before publishing.
  deb-install:
    name: .deb installs on ${{ matrix.image }}${{ matrix.arch == 'arm64' && ' (arm64)' || '' }}${{ matrix.edition == 'gpl' && ' / gpl' || '' }}
    needs: bundle
    if: ${{ !cancelled() }}
    # The container images are multi-architecture, so on the ARM runner they are arm64.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "debian:12"]
        edition: [standard, gpl]
        arch: [x64, arm64]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: skidbladnir-${{ matrix.arch == 'arm64' && 'linux-arm64' || 'linux' }}-${{ matrix.edition }}
          path: dist

      - name: Install it with apt, and resolve its libraries
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ./dist/*.deb
          ldd /usr/bin/skidbladnir > "$RUNNER_TEMP/ldd.txt" 2>&1 || true
          cat "$RUNNER_TEMP/ldd.txt"
          # A library missing outright, or present at too old a version, both read "not found".
          if grep -q 'not found' "$RUNNER_TEMP/ldd.txt"; then
            echo "::error::the ${{ matrix.edition }} .deb does not run on ${{ matrix.image }}"
            exit 1
          fi

  # The .rpm, the same way: dnf installs it on Fedora, resolving WebKitGTK and GTK from
  # Fedora's own repositories, and the loader then finds every library the app needs.
  rpm-install:
    name: .rpm installs on ${{ matrix.image }}${{ matrix.arch == 'arm64' && ' (arm64)' || '' }}${{ matrix.edition == 'gpl' && ' / gpl' || '' }}
    needs: bundle
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest"]
        edition: [standard, gpl]
        arch: [x64, arm64]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: skidbladnir-${{ matrix.arch == 'arm64' && 'linux-arm64' || 'linux' }}-${{ matrix.edition }}
          path: dist

      - name: Install it with dnf, and resolve its libraries
        run: |
          dnf install -y ./dist/*.rpm
          ldd /usr/bin/skidbladnir > "$RUNNER_TEMP/ldd.txt" 2>&1 || true
          cat "$RUNNER_TEMP/ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/ldd.txt"; then
            echo "::error::the ${{ matrix.edition }} .rpm does not run on ${{ matrix.image }}"
            exit 1
          fi
          # The bundled libheif, not Fedora's, which has no Kvazaar (or x265) encoder.
          grep -q 'lib/skidbladnir/libheif.so.1' "$RUNNER_TEMP/ldd.txt" || { echo "::error::the app does not load its own libheif"; exit 1; }
          test -f /usr/share/metainfo/com.basicautomation.skidbladnir.metainfo.xml

  # The complete corresponding source, which the GPL edition's licence requires to travel
  # with its installers: the repository at this tag WITH its submodules (x265, libheif,
  # libde265, Kvazaar, libavif, libaom, libwebp, libjpeg-turbo), which GitHub's own
  # "Source code" downloads leave out. Its notices
  # file names this asset.
  source:
    name: source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ (inputs.dry_run && github.ref) || inputs.tag || github.ref }}
          submodules: true

      - name: Archive the source with its submodules
        id: archive
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          # Not `$name`: `git submodule foreach` sets that to each submodule's own name.
          export archive_root="Skidbladnir-$version"
          git archive --format=tar --prefix="$archive_root/" HEAD > "$RUNNER_TEMP/source.tar"
          git submodule foreach --quiet 'git archive --format=tar --prefix="$archive_root/$sm_path/" HEAD > "$RUNNER_TEMP/submodule-$(basename "$sm_path").tar"'
          for part in "$RUNNER_TEMP"/submodule-*.tar; do tar --concatenate --file="$RUNNER_TEMP/source.tar" "$part"; done
          gzip -9 < "$RUNNER_TEMP/source.tar" > "$archive_root-source.tar.gz"
          # Every submodule must be in it; an empty or missing one would be a source
          # archive that cannot build what was shipped.
          tar -tzf "$archive_root-source.tar.gz" > "$RUNNER_TEMP/contents"
          for module in libheif libde265 kvazaar x265 libavif aom libwebp libjpeg-turbo; do
            grep -q "^$archive_root/third_party/$module/." "$RUNNER_TEMP/contents" || { echo "::error::third_party/$module is missing from the archive"; exit 1; }
          done
          ls -la "$archive_root-source.tar.gz"
          echo "file=$archive_root-source.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: source-archive
          path: ${{ steps.archive.outputs.file }}
          if-no-files-found: error

      - name: Attach to the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ inputs.tag }}" ]; then
            echo "::error::a manual run needs a tag, or dry_run"
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --notes "Artifacts attached by CI. Notes pending."
          fi
          gh release upload "$TAG" "${{ steps.archive.outputs.file }}" --clobber

  # The updater manifests. Runs after every platform has finished, whatever they did, and
  # lists the ones that produced signed installers (scripts/updater-manifest.py): one per
  # edition, latest.json for the standard edition and latest-gpl.json for the GPL one.
  #
  # The installed app reads it from the `updater` branch, not from the release. That began
  # because `releases/latest` skips prereleases and every release before 1.0.0 was one; it
  # also means only this job decides what installed copies are offered. The branch holds
  # only the manifests, and only this job writes to it. It writes nothing while the tag's
  # release is a draft, as it is when the tag was pushed on its own: publish the release,
  # then re-run this job.
  manifest:
    name: updater manifest
    needs: bundle
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Two releases racing to rewrite latest.json must not interleave.
    concurrency: updater-manifest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ (inputs.dry_run && github.ref) || inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          pattern: skidbladnir-*
          path: dist-artifacts
          merge-multiple: true

      - name: Write latest.json and latest-gpl.json
        id: write
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            tag="v$version"
          else
            tag="$TAG"
            # The tag and the manifest's version must agree, or clients would download one
            # version believing it to be another and offer it again on every launch.
            if [ "$tag" != "v$version" ]; then
              echo "::error::tag $tag does not match the version in src-tauri/Cargo.toml ($version)"
              exit 1
            fi
            gh release view "$tag" --json body -q .body > notes.md || true
            # Installed copies download from the release, and a draft's files are not
            # public: offered a draft, every copy would fail to download the update. So the
            # manifests are written, but reach the updater branch only once the release is
            # published. Publish it, then re-run this job; a re-run reuses this run's
            # installers and signatures, and reads the published notes.
            draft=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null) || draft=missing
            case "$draft" in
              false) echo "public=true" >> "$GITHUB_OUTPUT" ;;
              true) echo "::warning::$tag is still a draft, so installed copies are not offered it yet. Publish the release, then re-run this job." ;;
              *) echo "::warning::there is no release for $tag to download it from, so installed copies are not offered it." ;;
            esac
          fi
          if ! ls dist-artifacts/*.sig >/dev/null 2>&1; then
            echo "::warning::no platform produced updater signatures; no manifest is published and installed copies will not be offered $tag"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          manifests=()
          for edition in standard gpl; do
            case "$edition" in standard) prefix=Skidbladnir_; out=latest.json ;; gpl) prefix=Skidbladnir-GPL_; out=latest-gpl.json ;; esac
            if scripts/updater-manifest.py --dir dist-artifacts --prefix "$prefix" --version "$version" --tag "$tag" --repo "${{ github.repository }}" --notes-file notes.md --out "$out"; then
              cat "$out"
              manifests+=("$out")
            else
              echo "::warning::no signed $edition-edition installers; $out is not published and its installed copies will not be offered $tag"
            fi
          done
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "manifests=${manifests[*]}" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: steps.write.outputs.publish == 'true'
        with:
          name: updater-manifest
          path: latest*.json
          # A re-run of this job, after a draft is published, writes it again.
          overwrite: true

      - name: Publish to the updater branch
        # Only to the branch, which is what installed copies read. Attached to the release
        # as well, the manifests were two more files on the release page that nobody
        # downloads; each release's manifests stay in the branch's history. Never while
        # the release is a draft or missing (the step above says why).
        if: ${{ steps.write.outputs.publish == 'true' && steps.write.outputs.public == 'true' && !inputs.dry_run }}
        env:
          TAG: ${{ steps.write.outputs.tag }}
          VERSION: ${{ steps.write.outputs.version }}
          MANIFESTS: ${{ steps.write.outputs.manifests }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="$RUNNER_TEMP/updater"
          if git fetch --depth 1 origin updater 2>/dev/null; then
            git worktree add "$branch" FETCH_HEAD
          else
            git worktree add --detach "$branch"
            git -C "$branch" checkout --orphan updater
            git -C "$branch" rm -rf --quiet .
          fi
          for manifest in $MANIFESTS; do
            # Re-running an older tag's release must not roll every client back to it.
            current=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$branch/$manifest" 2>/dev/null || echo 0)
            newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)
            if [ "$newest" != "$VERSION" ]; then
              echo "the updater branch already offers $current in $manifest, newer than $VERSION; leaving it"
              continue
            fi
            cp "$manifest" "$branch/$manifest"
            git -C "$branch" add "$manifest"
          done
          if git -C "$branch" diff --cached --quiet; then
            echo "latest.json is unchanged"
            exit 0
          fi
          git -C "$branch" commit -m "updater: offer $TAG"
          git -C "$branch" push origin HEAD:refs/heads/updater
