# Builds the Tauri app on all three platforms for a tagged release and attaches the
# installers to the GitHub release for that tag.
#
# The dev host can only build Linux, so Windows and macOS artifacts exist *only* because
# this workflow produces them. A release cut without a successful run here has Linux
# artifacts and nothing else, and its notes must say so.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and attach artifacts to (e.g. v0.5.0). Ignored for a dry run.
        required: false
        type: string
      dry_run:
        description: Build the branch this was dispatched on and keep the installers as workflow artifacts, attaching nothing to any release. How a change to this workflow is tested before a tag exists.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bundle:
    name: bundle / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not deny the release the artifacts the others produced.
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, target: "" }
          - { name: windows, os: windows-latest, target: "" }
          # macos-latest is Apple Silicon, so its native build is aarch64 only. Intel Macs
          # get their own .dmg, cross-built on the same runner.
          - { name: macos-arm64, os: macos-latest, target: "" }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin }

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ (inputs.dry_run && github.ref) || inputs.tag || github.ref }}

      - name: Install the Linux system dependencies Tauri needs
        # patchelf is what bundles the AppImage. It is unavailable on the dev host, which
        # is owner-gated there — but it is a plain apt package here, so the AppImage is
        # produced in CI even though it cannot be produced locally.
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build the frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run generate

      - name: Bundle
        # `tauri build` enables the custom-protocol feature, which is what makes the binary
        # serve the embedded frontend rather than the dev server. The CLI is the prebuilt
        # `@tauri-apps/cli` from the frontend's lockfile, as in ci.yml, rather than
        # `cargo install tauri-cli`, which compiled it from source on every platform.
        shell: bash
        run: |
          cd src-tauri
          if [ -n "${{ matrix.target }}" ]; then
            ../frontend/node_modules/.bin/tauri build --target "${{ matrix.target }}"
          else
            ../frontend/node_modules/.bin/tauri build
          fi

      - name: Collect the artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # `find` rather than a fixed list: the bundle layout differs per platform and a
          # missing glob must not silently produce an empty upload.
          # target/<triple>/release/bundle for a cross build, target/release/bundle otherwise.
          find target -path '*/release/bundle/*' -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} dist-artifacts/ \;
          ls -la dist-artifacts
          if [ -z "$(ls -A dist-artifacts)" ]; then
            echo "::error::No installers were produced for ${{ matrix.name }}"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: skidbladnir-${{ matrix.name }}
          path: dist-artifacts/*
          if-no-files-found: error

      - name: Attach to the release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # A manual run that is not a dry run must name its tag; otherwise TAG would fall
          # back to the branch name and create a stray draft release named after it.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ inputs.tag }}" ]; then
            echo "::error::a manual run needs a tag, or dry_run"
            exit 1
          fi
          # The workflow can be reached two ways: a tag pushed on its own, or a tag created
          # alongside a release. In the first case there is no release to upload to yet, and
          # `gh release upload` would simply fail — so create a draft prerelease to hold the
          # artifacts rather than losing a green build to an ordering accident.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no release for $TAG yet; creating a draft prerelease to hold the artifacts"
            gh release create "$TAG" --draft --prerelease --title "$TAG" --notes "Artifacts attached by CI. Notes pending."
          fi
          gh release upload "$TAG" dist-artifacts/* --clobber
