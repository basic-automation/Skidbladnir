# CI for the Rust + Tauri 2 workspace. The Electron app at the repo root is not built
# here: it is Windows-only, unbuildable on a Linux runner without its downloaded cwebp,
# and is being retired in Phase 6 of ROADMAP.md.
#
# Rust is pinned to **stable**. The dev host defaults to nightly only because its global
# cargo config sets a nightly-only rustflag; nothing in this tree may need nightly, and
# this job is what proves it.
name: CI

on:
  push:
    # `routine/**` is included so the scheduled dev routine gets a real CI result on
    # each increment it pushes, instead of only finding out when it opens the PR.
    branches: [master, "routine/**"]
  pull_request:
  workflow_dispatch:

# Every job here reads the repository and nothing else: checkout, caches and artifacts
# (which use the runner's own token, not this one), and tools downloaded from public
# releases. So the job token can only read, whatever the repository's default is.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Build libjxl, libavif with libaom, and libjpeg-turbo from source and link them
  # statically, as releases do, and fail if that cannot happen rather than quietly linking
  # whatever the runner has.
  SKIDBLADNIR_LIBJXL: vendored
  SKIDBLADNIR_LIBAVIF: vendored
  SKIDBLADNIR_LIBJPEG: vendored

jobs:
  # Formatting gets its own job on **nightly rustfmt**, deliberately, while everything
  # that compiles stays on stable below.
  #
  # rustfmt.toml uses `imports_layout`, `imports_granularity` and `group_imports`, which
  # rustfmt still gates behind nightly. Stable rustfmt does not error on them, it silently
  # ignores them and formats the file differently — so a stable `cargo fmt --check` fails
  # against a tree formatted by a nightly rustfmt, which is exactly what happened the first
  # time this workflow ran. Using nightly here keeps the owner's import style (which needs
  # nightly rustfmt by design) without letting nightly anywhere near the build.
  fmt:
    name: rustfmt (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Supply chain: advisories, licences, duplicate pressure and source allow-listing.
  # Its own job because it is platform-independent and should not wait on three builds.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The notices check reads the native libraries' licences from the submodules.
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          # cargo-about pinned: another version may word the same licences differently.
          tool: cargo-deny,cargo-about@0.9.2
      - run: cargo deny check
      - name: Rust crates' notices are current
        # LICENSES/third-party/rust-crates.md is cargo-about's listing of the crates compiled
        # into the app (about.toml); a Cargo.lock change without regenerating it fails here.
        run: |
          cargo about generate --locked --fail about.hbs -o "$RUNNER_TEMP/rust-crates.md"
          diff -u LICENSES/third-party/rust-crates.md "$RUNNER_TEMP/rust-crates.md" > "$RUNNER_TEMP/rust-crates.diff" || { head -n 50 "$RUNNER_TEMP/rust-crates.diff"; echo "::error::LICENSES/third-party/rust-crates.md is stale: run cargo about generate --locked --fail about.hbs -o LICENSES/third-party/rust-crates.md, then scripts/third-party-notices.py"; exit 1; }
      - name: Third-party notices are current
        # THIRD-PARTY-NOTICES.md and THIRD-PARTY-NOTICES-GPL.md are generated from the
        # licence files of the exact native sources that are built; bumping one without
        # regenerating them fails here.
        run: python3 scripts/third-party-notices.py --check

  # Both editions on every platform. They differ only in HEIC's encoder — Kvazaar in the
  # standard edition, x265 in the GPL one (the `gpl` feature, here through `full`) — but
  # each links its own libheif, so each is built and tested on its own. The standard legs
  # keep their old names.
  rust:
    name: rust / ${{ matrix.os }}${{ matrix.edition == 'gpl' && ' / gpl' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform's result is wanted on every run: a Windows-only or macOS-only
      # break is exactly what the dev host cannot see, so do not cancel its siblings.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        edition: [standard, gpl]
    env:
      FEATURES: ${{ matrix.edition == 'gpl' && 'skidbladnir/custom-protocol,skidbladnir/full' || 'skidbladnir/custom-protocol' }}
      # RUSTFLAGS replaces .cargo/config.toml's target rustflags rather than adding to
      # them, so Windows has to repeat the static C runtime here (see that file).
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}

    steps:
      - uses: actions/checkout@v7
        with:
          # libheif, Kvazaar, x265 and libde265 are pinned submodules under third_party/.
          submodules: true

      - name: Install the Linux system dependencies Tauri needs
        # Needed from Phase 1 onward, when src-tauri/ joins the workspace: Tauri 2 links
        # against webkit2gtk-4.1, and patchelf is what bundles the AppImage.
        # libavif-bin is libavif's `avifdec` and `avifenc`, for the AVIF gates, and
        # libjxl-tools is libjxl's `djxl`, the reference decoder for the JPEG XL gate,
        # and libheif-examples is libheif's `heif-dec`, the reference decoder for HEIC's.
        # The xkbcommon, xcb, Wayland, fontconfig and FreeType headers are the gpui window's.
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libfontconfig-dev libfreetype-dev libavif-bin libjxl-tools libheif-examples libheif-plugin-libde265

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache the Nuxt build
        # npm's own cache (above) only covers downloads. Nuxt 4 keeps its build cache in
        # node_modules/.cache, so this is what stops all three runners regenerating an
        # unchanged frontend from scratch. Keyed on the lockfile and the frontend sources.
        uses: actions/cache@v6
        with:
          path: frontend/node_modules/.cache
          key: nuxt-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.vue', 'frontend/**/*.ts', 'frontend/**/*.css') }}
          restore-keys: |
            nuxt-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
            nuxt-${{ runner.os }}-

      - name: Build the frontend
        # This is NOT optional and NOT merely "the frontend job". `tauri::generate_context!`
        # embeds `frontendDist` at COMPILE time, so without these two steps the Rust build
        # fails with "the frontendDist configuration is set to ... but this path doesn't
        # exist" — a proc-macro panic, not a missing-asset warning.
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run generate

      - name: The JavaScript packages' notices are current
        # LICENSES/third-party/javascript.md lists the npm packages whose code the bundle just
        # built carries (frontend/tools/javascript-notices.ts); a lockfile or import change
        # without regenerating it fails here. One leg is enough: the bundle is the same on all.
        if: matrix.os == 'ubuntu-latest' && matrix.edition == 'standard'
        run: |
          SKIDBLADNIR_JS_NOTICES="$RUNNER_TEMP/javascript.md" npm --prefix frontend run generate
          diff -u LICENSES/third-party/javascript.md "$RUNNER_TEMP/javascript.md" || { echo "::error::LICENSES/third-party/javascript.md is stale: run SKIDBLADNIR_JS_NOTICES=../LICENSES/third-party/javascript.md npm run generate in frontend/, then scripts/third-party-notices.py"; exit 1; }

      - name: Install nasm
        # libaom, libjpeg-turbo and the AV1 decoder (rav1d) assemble their SIMD with nasm;
        # rav1d's and libaom's builds fail outright without it. So does x265's, in the GPL
        # edition.
        uses: ilammy/setup-nasm@v1

      - name: Build libheif (${{ matrix.edition }} edition)
        uses: ./.github/actions/libheif
        with:
          edition: ${{ matrix.edition }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.edition }}

      # Not --all-features: that would build the standard legs with x265, against a
      # libheif that has none (build.rs refuses the mismatch).
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --features "${{ env.FEATURES }}" -- -D warnings

      - name: cargo build
        run: cargo build --workspace --all-targets --features "${{ env.FEATURES }}"

      - name: cargo test
        run: cargo test --workspace --features "${{ env.FEATURES }}"

      - name: HEIC reference decoder for the GPL edition
        # The standard legs get heif-dec with the parity step below; this leg skips that
        # step (parity is libwebp's, the same in both editions) but still checks what x265
        # writes against the runner's own libheif. Ubuntu's comes with the system
        # dependencies above; Windows has none, so it is reported there, not required.
        if: matrix.edition == 'gpl' && matrix.os != 'windows-latest'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install libheif; fi
          echo "SKIDBLADNIR_REQUIRE_PARITY=1" >> "$GITHUB_ENV"

      - name: x265 output against heif-dec
        if: matrix.edition == 'gpl'
        run: cargo test --package skidbladnir-encode --features x265 --test heic_reference -- --nocapture

      - name: Install the reference decoders (macOS)
        # avifdec and avifenc, djxl and heif-dec; Linux has them from apt above.
        if: matrix.os == 'macos-latest' && matrix.edition == 'standard'
        run: brew install libavif jpeg-xl libheif

      - name: reference decoders read what we write
        # Required on Linux and macOS, where the decoders are installed; reported only on
        # Windows, which has none. The GPL legs check their own HEIC above.
        if: matrix.edition == 'standard'
        env:
          SKIDBLADNIR_REQUIRE_PARITY: ${{ matrix.os != 'windows-latest' && '1' || '' }}
        # The encoders' byte parity is the `parity` job's. These are the gates a reference
        # DECODER keeps, run on every platform: libavif's avifdec decodes what we write
        # (avif_reference), libjxl's djxl decodes it and rebuilds recompressed JPEGs
        # (jxl_reference), and the runner's own libheif (heif-dec) decodes our HEIC
        # (heic_reference). avif_input is the wide AVIF-input gate: avifenc writes 17 colour
        # encodings and our decoder must agree with avifdec's reading of them. Each prints
        # its verdict or a loud "NOT RUN".
        run: cargo test --package skidbladnir-encode --test avif_reference --test jxl_reference --test heic_reference --test avif_input -- --nocapture

  # Byte parity with the four reference encoders — the claim that every result of cwebp,
  # avifenc, cjxl and heif-enc (with Kvazaar) for a still image is one Skidbladnir can
  # produce. Each reference is built from the source of the library we link, and all of them
  # read JPEG through the libjpeg-turbo we link (scripts/build-reference-tools.sh), so a
  # mismatch is an option or a reader that differs, never a version. A missing or
  # mismatched reference fails the job rather than skipping it.
  #
  # Linux x86-64, Linux on ARM64 and macOS on Apple silicon: the same sources built on
  # each, so the comparison also covers libwebp's, libaom's and libjxl's ARM code paths, on
  # both ARM systems the releases ship for.
  parity:
    name: parity with the reference encoders / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install the reference tools' development files, and the decoders
        # libtiff is cwebp's TIFF reader; giflib is for gif2webp, the reference for GIF input;
        # OpenEXR is cjxl's EXR reader. avifdec, djxl and heif-info are the metadata gate's readers for AVIF, JPEG XL and
        # HEIC output (tests/metadata.rs), which has no byte-for-byte reference there.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpng-dev libtiff-dev libgif-dev libopenexr-dev zlib1g-dev libavif-bin libjxl-tools libheif-examples libheif-plugin-libde265

      - name: Install the reference tools' development files, and the decoders (macOS)
        # The same, from Homebrew; zlib is the system's.
        if: runner.os == 'macOS'
        run: brew install libpng libtiff giflib openexr libavif jpeg-xl libheif

      - name: Install nasm
        # For x86 SIMD; Linux on ARM uses the system assembler.
        if: runner.os != 'Linux' || runner.arch == 'X64'
        uses: ilammy/setup-nasm@v1

      - name: Build libheif (Kvazaar + libde265)
        uses: ./.github/actions/libheif

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Restore the reference encoders
        id: references
        uses: actions/cache@v6
        with:
          path: build/reference
          key: reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.gitmodules', 'Cargo.lock', 'scripts/build-reference-tools.sh', 'scripts/build-reference-avifenc.sh', 'scripts/build-libheif.sh') }}-${{ github.sha }}
          restore-keys: reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.gitmodules', 'Cargo.lock', 'scripts/build-reference-tools.sh', 'scripts/build-reference-avifenc.sh', 'scripts/build-libheif.sh') }}-

      - name: Build the reference encoders
        run: |
          if [ -x build/reference/bin/cjxl ] && [ -x build/reference/bin/webpmux ]; then
            printf '%s\n' "SKIDBLADNIR_REFERENCE_CWEBP=$PWD/build/reference/bin/cwebp" "SKIDBLADNIR_REFERENCE_IMG2WEBP=$PWD/build/reference/bin/img2webp" "SKIDBLADNIR_REFERENCE_GIF2WEBP=$PWD/build/reference/bin/gif2webp" "SKIDBLADNIR_REFERENCE_WEBPMUX=$PWD/build/reference/bin/webpmux" "SKIDBLADNIR_REFERENCE_AVIFENC=$PWD/build/reference/bin/avifenc" "SKIDBLADNIR_REFERENCE_CJXL=$PWD/build/reference/bin/cjxl" "SKIDBLADNIR_REFERENCE_HEIF_ENC=$PWD/build/reference/heif/bin/heif-enc" >> "$GITHUB_ENV"
          else
            scripts/build-reference-tools.sh >> "$GITHUB_ENV"
          fi
          echo "SKIDBLADNIR_REQUIRE_PARITY=1" >> "$GITHUB_ENV"

      - name: byte parity with cwebp, img2webp, gif2webp, avifenc, cjxl and heif-enc
        # Released builds are what the claim is about, so the comparison is too, and
        # --no-fail-fast, so one failing gate cannot hide whether the others hold.
        # cmyk_jpeg rides along because it checks that cwebp still REFUSES a CMYK JPEG, the
        # one input Skidbladnir converts to WebP and cwebp does not. animation is animated
        # WebP against img2webp, gif is GIF input against gif2webp (and a still GIF against
        # cjxl), metadata is `-metadata` against cwebp, and pnm is PNM/PAM against cwebp and
        # cjxl and PFM against cjxl.
        run: cargo test --release --no-fail-fast --package skidbladnir-encode --test parity --test cmyk_jpeg --test avif_parity --test jxl_parity --test heic_parity --test animation --test gif --test metadata --test pnm -- --nocapture

  # Drives the real window over WebDriver. Separate from the compile matrix because it
  # needs a display, a WebKit driver and a full release build, and because a flaky display
  # must not be able to mask a genuine compile failure on another platform.
  #
  # Both editions: the GPL one is the same window with x265 behind it, and its own HEIC
  # checks. Both are audited, since the HEIC panel differs; the screenshots are the
  # standard edition's.
  window:
    name: window smoke + accessibility${{ matrix.edition == 'gpl' && ' (gpl)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [standard, gpl]
    steps:
      - uses: actions/checkout@v7
        with:
          # libheif, Kvazaar, x265 and libde265 are pinned submodules under third_party/.
          submodules: true

      - name: Install the system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libfontconfig-dev libfreetype-dev \
            webkit2gtk-driver xvfb mesa-vulkan-drivers libvulkan1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install nasm
        # libaom, libjpeg-turbo and the AV1 decoder (rav1d) assemble their SIMD with nasm;
        # rav1d's and libaom's builds fail outright without it.
        uses: ilammy/setup-nasm@v1

      - name: Build libheif (${{ matrix.edition }} edition)
        uses: ./.github/actions/libheif
        with:
          edition: ${{ matrix.edition }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.edition }}

      - name: Install the WebDriver shim
        run: cargo install tauri-driver --locked

      - name: Build the app
        # `tauri build` rather than `cargo build --release`: only the former enables the
        # custom-protocol feature that makes the binary serve the embedded frontend. A
        # binary built the other way opens showing "Connection refused" and every check
        # below would fail for the wrong reason.
        #
        # The CLI is the prebuilt `@tauri-apps/cli` from the frontend's lockfile, not
        # `cargo install tauri-cli`: compiling the CLI from source took about ten minutes
        # of this job on a cold cache, and the npm package is the same CLI as a download.
        # It is run from src-tauri/ because the CLI finds the app from its working
        # directory.
        run: |
          npm --prefix frontend ci
          args=()
          if [ "${{ matrix.edition }}" = gpl ]; then args+=(--features gpl --config tauri.gpl.conf.json); fi
          cd src-tauri && ../frontend/node_modules/.bin/tauri build --no-bundle "${args[@]}"

      - name: Smoke test the window
        # xvfb-run because there is no display on the runner. The harness forces the X11
        # backend, which is what WebKitWebDriver needs.
        run: xvfb-run -a scripts/smoke-test.sh --edition ${{ matrix.edition }}

      - name: Smoke test the gpui window
        # The default window since 1.3.0, which WebDriver cannot drive: scripts/gpui-smoke.sh
        # opens it with its debug variables and checks a conversion to each format on disk.
        # The runner has no GPU, so Vulkan is Mesa's lavapipe, on Xvfb's X11 display.
        run: xvfb-run -a env -u WAYLAND_DISPLAY scripts/gpui-smoke.sh --edition ${{ matrix.edition }}

      - name: Accessibility audit
        # At every severity, "minor" included: at the default ("serious") an <h1> outside
        # any landmark went unnoticed in every state from the Nanna redesign until 1.2.
        run: xvfb-run -a scripts/a11y-audit.sh --threshold minor

      - name: Capture the README screenshots
        if: matrix.edition == 'standard'
        # The dev host cannot take these (WebKitWebDriver's screenshot hangs under
        # XWayland), so CI does, on a virtual screen tall enough for every panel. They are
        # uploaded for a person to review and commit, never committed by CI itself.
        run: xvfb-run -a -s "-screen 0 1400x3200x24" scripts/screenshot.sh --app target/release/skidbladnir --out screenshots

      - uses: actions/upload-artifact@v7
        if: matrix.edition == 'standard'
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: error

  # A first slice of byte parity on Windows: cwebp built there with CMake and MSVC, against
  # the libwebp this crate builds there. cwebp would read PNG, JPEG and TIFF through WIC on
  # Windows, a different decoder from the ones the other gates match, so WIC is switched
  # off and only the gates that never hand cwebp those formats run: the PAM control
  # surface, the cwebp-defaults reset, WebP, PNM and raw YUV sources, and img2webp's and
  # webpmux's animation gates (ROADMAP.md, Phase 8).
  parity-windows:
    name: parity with cwebp, img2webp, webpmux / windows
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install nasm
        uses: ilammy/setup-nasm@v1

      - name: Build libheif (standard edition)
        uses: ./.github/actions/libheif

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the reference cwebp, img2webp and webpmux, without WIC
        run: |
          cmake -S third_party/libwebp -B "$RUNNER_TEMP/libwebp" -DBUILD_SHARED_LIBS=OFF -DHAVE_WINCODEC_H=0 -DWEBP_BUILD_CWEBP=ON -DWEBP_BUILD_DWEBP=OFF -DWEBP_BUILD_GIF2WEBP=OFF -DWEBP_BUILD_IMG2WEBP=ON -DWEBP_BUILD_VWEBP=OFF -DWEBP_BUILD_WEBPINFO=OFF -DWEBP_BUILD_WEBPMUX=ON -DWEBP_BUILD_ANIM_UTILS=OFF -DWEBP_BUILD_EXTRAS=OFF
          cmake --build "$RUNNER_TEMP/libwebp" --config Release --target cwebp img2webp webpmux
          for tool in cwebp img2webp webpmux; do
            path=$(find "$RUNNER_TEMP/libwebp" -iname "$tool.exe" | head -1)
            "$path" -version
            echo "SKIDBLADNIR_REFERENCE_$(echo "$tool" | tr a-z A-Z)=$(cygpath -m "$path")" >> "$GITHUB_ENV"
          done
          echo "SKIDBLADNIR_REQUIRE_PARITY=1" >> "$GITHUB_ENV"

      - name: byte parity with cwebp, img2webp and webpmux, for what they read without WIC
        # tests/parity.rs's PAM, WebP and raw YUV gates and tests/pnm.rs's cwebp ones (never a
        # PNG, JPEG or TIFF), and every tests/animation.rs gate (PAM frames).
        run: cargo test --release --package skidbladnir-encode --test parity --test pnm --test animation -- matches_reference_cwebp_across_the_whole_control_surface cwebps_defaults_are_a_bare_cwebp matches_reference_cwebp_through_a_webp_file matches_reference_cwebp_through_raw_yuv matches_cwebp_reading_pnm refuses_what_cwebp_refuses matches_reference_img2webp keeps_an_animations_metadata_as_webpmux_sets_it frame_changes_apply lossless_round_trip lossy_round_trip a_reference_animation a_still_webp resize_applies never_enlarge progress_and_cancel controls_without --nocapture

  # The next slice: cwebp, img2webp, gif2webp and webpmux on Windows with the image
  # libraries the Linux references use rather than WIC — libjpeg-turbo from our own
  # submodule (the version the app links), libpng, libtiff and giflib from vcpkg, all on the
  # static C runtime — so every tests/parity.rs, tests/animation.rs and tests/gif.rs gate can
  # run there. Not yet a gate: it has not been seen to pass (ROADMAP.md, Phase 8).
  parity-windows-images:
    name: parity with libwebp's tools and image readers / windows (trial)
    runs-on: windows-2022
    timeout-minutes: 75
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install nasm
        uses: ilammy/setup-nasm@v1

      - name: Build libheif (standard edition)
        uses: ./.github/actions/libheif

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the reference tools with libjpeg-turbo, libpng, libtiff and giflib
        run: |
          vcpkg="$(cygpath -u "$VCPKG_INSTALLATION_ROOT")"
          "$vcpkg/vcpkg.exe" install --triplet x64-windows-static libpng "tiff[core]" giflib
          jpeg="$RUNNER_TEMP/jpeg-install"
          cmake -S third_party/libjpeg-turbo -B "$RUNNER_TEMP/jpeg" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DWITH_JPEG8=ON -DWITH_TURBOJPEG=OFF -DWITH_TOOLS=OFF -DWITH_TESTS=OFF "-DCMAKE_INSTALL_PREFIX=$jpeg"
          cmake --build "$RUNNER_TEMP/jpeg" --config Release
          cmake --install "$RUNNER_TEMP/jpeg" --config Release
          jpeglib=$(find "$jpeg" -iname 'jpeg-static.lib' | head -1)
          cmake -S third_party/libwebp -B "$RUNNER_TEMP/libwebp" "-DCMAKE_TOOLCHAIN_FILE=$vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DBUILD_SHARED_LIBS=OFF -DWEBP_LINK_STATIC=OFF -DHAVE_WINCODEC_H=0 "-DJPEG_LIBRARY=$(cygpath -m "$jpeglib")" "-DJPEG_INCLUDE_DIR=$(cygpath -m "$jpeg/include")" -DWEBP_BUILD_CWEBP=ON -DWEBP_BUILD_DWEBP=OFF -DWEBP_BUILD_GIF2WEBP=ON -DWEBP_BUILD_IMG2WEBP=ON -DWEBP_BUILD_VWEBP=OFF -DWEBP_BUILD_WEBPINFO=OFF -DWEBP_BUILD_WEBPMUX=ON -DWEBP_BUILD_ANIM_UTILS=OFF -DWEBP_BUILD_EXTRAS=OFF
          cmake --build "$RUNNER_TEMP/libwebp" --config Release --target cwebp img2webp gif2webp webpmux
          for tool in cwebp img2webp gif2webp webpmux; do
            path=$(find "$RUNNER_TEMP/libwebp" -iname "$tool.exe" | head -1)
            "$path" -version
            echo "SKIDBLADNIR_REFERENCE_$(echo "$tool" | tr a-z A-Z)=$(cygpath -m "$path")" >> "$GITHUB_ENV"
          done
          echo "SKIDBLADNIR_REQUIRE_PARITY=1" >> "$GITHUB_ENV"

      - name: byte parity with cwebp, img2webp, gif2webp and webpmux
        run: |
          cargo test --release --no-fail-fast --package skidbladnir-encode --test parity --test animation --test gif -- --skip matches_cjxl_reading_a_still_gif --nocapture
          cargo test --release --package skidbladnir-encode --test pnm -- matches_cwebp_reading_pnm refuses_what_cwebp_refuses --nocapture

  # The same smoke test, on Windows. This is the only place the Windows build is
  # LAUNCHED rather than just compiled: the dev host cannot run it, and nobody had
  # opened a Windows build before this job existed. The Electron app is Windows-only,
  # so ROADMAP.md Phase 6 does not retire it until this job has been green.
  #
  # tauri-driver drives Windows through Microsoft's msedgedriver, which must match the
  # installed WebView2 exactly. msedgedriver-tool reads that version and fetches the
  # matching driver from Microsoft. It is pinned to a commit (v0.2.2) rather than a
  # branch, because it runs with the job's token.
  #
  # Pinned to windows-2022, not windows-latest: on the windows-2025 image WebView2 never
  # opens the DevTools port msedgedriver needs, and every session fails with
  # "DevToolsActivePort file doesn't exist" (seen here with WebView2 153). The reporter of
  # https://github.com/actions/runner-images/issues/14738 found that switching only the
  # image to windows-2022 fixes it, and no launch-flag workaround did. Revisit when
  # windows-2022 is retired.
  window-windows:
    name: window smoke (windows)
    runs-on: windows-2022
    env:
      # As in the rust job: RUSTFLAGS would otherwise drop .cargo/config.toml's static C runtime.
      RUSTFLAGS: -D warnings -C target-feature=+crt-static
    # A GUI installer that stops to ask a question never returns. Bound the job rather
    # than let a hang hold a runner for GitHub's six-hour default.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # libheif, Kvazaar, x265 and libde265 are pinned submodules under third_party/.
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install nasm
        # libaom, libjpeg-turbo and the AV1 decoder (rav1d) assemble their SIMD with nasm;
        # rav1d's and libaom's builds fail outright without it.
        uses: ilammy/setup-nasm@v1

      - name: Build libheif (standard edition)
        uses: ./.github/actions/libheif

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install the WebDriver shim and a WebView2-matched msedgedriver
        run: |
          cargo install tauri-driver --locked
          cargo install --locked --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1
          mkdir -p "$RUNNER_TEMP/edgedriver"
          cd "$RUNNER_TEMP/edgedriver" && msedgedriver-tool
          ls -la "$RUNNER_TEMP/edgedriver"
          echo "$RUNNER_TEMP/edgedriver" >> "$GITHUB_PATH"

      - name: Build the app and its installer
        # See the Linux window job: `tauri build`, not `cargo build --release`, for the
        # custom-protocol feature. The NSIS installer is built too, because what users
        # run is the installed app, not the bare executable.
        run: |
          npm --prefix frontend ci
          cd src-tauri && ../frontend/node_modules/.bin/tauri build --bundles nsis

      - name: Install it the way a user would, silently
        # Tauri's NSIS installer defaults to a per-user install under
        # %LOCALAPPDATA%\<productName>. Find the executable rather than trusting that
        # path, and fail loudly if the installer put nothing anywhere.
        run: |
          installer=$(ls target/release/bundle/nsis/*-setup.exe)
          echo "installing $installer"
          # MSYS_NO_PATHCONV: Git Bash rewrites a bare `/S` into a drive path, which turns
          # a silent install into an interactive one waiting for a click. That hung this
          # step for half an hour before the fix.
          MSYS_NO_PATHCONV=1 timeout 300 "$installer" /S
          app=""
          for _ in $(seq 1 60); do
            app=$(find "$(cygpath -u "$LOCALAPPDATA")/Skidbladnir" -maxdepth 1 -iname 'skidbladnir.exe' 2>/dev/null | head -1)
            [ -n "$app" ] && break
            sleep 1
          done
          if [ -z "$app" ]; then
            echo "::error::the installer did not put skidbladnir.exe under %LOCALAPPDATA%\Skidbladnir"
            find "$(cygpath -u "$LOCALAPPDATA")" -maxdepth 3 -iname 'skidbladnir*' || true
            exit 1
          fi
          ls -la "$app"
          echo "INSTALLED_APP=$app" >> "$GITHUB_ENV"

      - name: Smoke test the installed app
        run: scripts/smoke-test.sh --app "$INSTALLED_APP"

      - name: Smoke test the gpui window of the installed app
        # The default window, which WebDriver cannot drive; Direct3D falls back to WARP on a
        # runner with no GPU.
        run: scripts/gpui-smoke.sh --app "$INSTALLED_APP"
